# CI 冒烟构建:在 ubuntu:20.04 容器内编译 linux/amd64,
# 保证 glibc 符号 <= 2.31、webkit2gtk ABI 为 4.0,与麒麟 V10 SP1 桌面版对齐。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.24.8"
  WAILS_VERSION: "v2.16.0"

jobs:
  build-linux:
    name: Linux amd64 build (ubuntu:20.04 / glibc 2.31)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build inside ubuntu:20.04 container
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e GO_VERSION -e WAILS_VERSION \
            ubuntu:20.04 bash -euxc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config \
                ca-certificates curl xz-utils file binutils
              curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz
              tar -C /usr/local -xzf /tmp/go.tgz
              export PATH=/usr/local/go/bin:/root/go/bin:$PATH
              go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
              go test ./...
              wails build -platform linux/amd64 -ldflags "-s -w -X main.version=ci"
            '

      - name: Sanity check (deps & glibc ceiling)
        run: |
          docker run --rm -v "$PWD":/src -w /src ubuntu:20.04 bash -euxc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends file binutils
            echo "== file =="; file build/bin/snake-game
            echo "== linked libraries =="; ldd build/bin/snake-game
            echo "== max GLIBC symbol (must be <= 2.31) =="
            objdump -T build/bin/snake-game | grep -o "GLIBC_[0-9.]*" | sort -uV | tail -1
          '

      - uses: actions/upload-artifact@v4
        with:
          name: snake-game-linux-amd64-ci
          path: build/bin/snake-game
          if-no-files-found: error
