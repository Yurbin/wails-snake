# 发布构建:推 tag v* 触发,在 ubuntu:20.04 容器内编译 linux/amd64,
# 组装绿色便携包(tar.gz + sha256)并挂到 GitHub Release。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GO_VERSION: "1.24.8"
  WAILS_VERSION: "v2.16.0"

jobs:
  build:
    name: Build portable linux/amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build inside ubuntu:20.04 container
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          docker run --rm -v "$PWD":/src -w /src \
            -e GO_VERSION -e WAILS_VERSION -e VERSION \
            ubuntu:20.04 bash -euxc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config \
                ca-certificates curl xz-utils file binutils
              curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz
              tar -C /usr/local -xzf /tmp/go.tgz
              export PATH=/usr/local/go/bin:/root/go/bin:$PATH
              go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
              wails build -platform linux/amd64 \
                -ldflags "-s -w -X main.version=${VERSION}"
              echo "== linked libraries =="
              ldd build/bin/snake-game
              echo "== max GLIBC symbol (must be <= 2.31) =="
              MAX_GLIBC=$(objdump -T build/bin/snake-game | grep -o "GLIBC_[0-9.]*" | sort -uV | tail -1)
              echo "$MAX_GLIBC"
              VER_NUM="${MAX_GLIBC#GLIBC_}"
              if [ "$(printf "%s\n" "2.31" "$VER_NUM" | sort -V | tail -1)" != "2.31" ]; then
                echo "ERROR: glibc symbol ${VER_NUM} exceeds 2.31 (Kylin V10 SP1)"
                exit 1
              fi
              echo "glibc ceiling OK"
            '

      - name: Assemble portable bundle
        run: |
          VER="${{ steps.ver.outputs.version }}"
          NAME="wails-snake_${VER}_linux_amd64"
          STAGE="dist-portable/${NAME}"
          mkdir -p "${STAGE}"
          cp build/bin/snake-game "${STAGE}/"
          cp scripts/check-deps.sh "${STAGE}/"
          cp scripts/启动说明.txt "${STAGE}/"
          tar -czf "${NAME}_portable.tar.gz" -C dist-portable "${NAME}"
          sha256sum "${NAME}_portable.tar.gz" > "${NAME}_portable.tar.gz.sha256"
          cat "${NAME}_portable.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: portable-linux-amd64
          path: |
            wails-snake_*_linux_amd64_portable.tar.gz
            wails-snake_*_linux_amd64_portable.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portable-linux-amd64

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            wails-snake_*_linux_amd64_portable.tar.gz
            wails-snake_*_linux_amd64_portable.tar.gz.sha256
          generate_release_notes: true
